name: test-suite baseline measurement

# C3 (ci-full-suite) M1 축 A. 전수 test 실행의 벽시계와 **파일 단위 분해**를 뜬다.
#
# ── Scope note (mirror: gitignore-drift.yml) ─────────────────────────────────
# 이 workflow는 **측정이다. 강제가 아니다.** 여기서 red가 나도 아무것도 막지
# 않는다 — 실행 단계가 `continue-on-error: true`이기 때문이다. 전 PR 적용 범위 ·
# 커버리지 산출 · branch protection은 전부 M3 소유이고, 머지 차단은 이 파일이
# 아니라 저장소 설정이 정한다.
#
# ── 트리거가 하나인 이유 (M3 DD1) ───────────────────────────────────────────
# 원래 `pull_request`가 함께 있었고, 그 사유는 하나뿐이었다: GitHub은
# `workflow_dispatch`를 **default branch에 있는 workflow 파일에 대해서만** 받으므로
# 머지 전에는 `gh workflow run`이 이 파일을 찾지 못한다는 것. 이 파일은 **이미
# main에 있으므로 그 사유가 소멸했다.** 제거하면 강제 게이트(`test-suite.yml`)와 이
# 파일이 같은 스위트를 중복 실행하는 일도 함께 사라진다.
#
# ── OS 축 (M3 DD8 · OQ3) ────────────────────────────────────────────────────
# matrix에 `windows-latest`를 더해 Windows 원소를 1회 측정한다. 결정 규칙은 측정
# **전에** 못박혀 있다(DD8): Windows 전용 red가 0건이면 PR 게이트는 Linux 전용으로
# 두고 Windows는 dispatch 측정으로만 유지하고, 1건 이상이면 matrix에 넣되 벽시계가
# Linux의 10배를 넘으면 별도 트리거로 분리한다. 규칙을 측정 후에 바꾸지 않는다(UI8).
#
# ── run 성공은 증거가 아니다 ─────────────────────────────────────────────────
# `continue-on-error: true` + `if: always()`가 결합하면 `run.js`가 예외로 죽어
# **빈 artifact**를 남겨도 run은 success이고 artifact는 존재한다. 그래서 수용
# 증거는 run 상태가 아니라 **artifact 내용**이다 — 다운로드한 JSON이
# `ok === true` ∧ `per_file.length === files_total` ∧ `redaction_ok === true`
# 여야 한다(Acceptance 1·3). 그 검사를 이 workflow 안에 넣지 않는 이유는
# `continue-on-error`가 그것도 함께 삼키기 때문이다.
#
# ── 비용 ─────────────────────────────────────────────────────────────────────
# 전수 순차 합계는 로컬 실측 173.6분이고 단일 최장 파일이 23.3분이다. 병렬
# 벽시계의 하한은 코어 수가 아니라 **그 최장 파일**이며, 러너 코어가 적으면
# `합계 / 코어`가 지배한다. `timeout-minutes`를 넉넉히 두되 무한은 아니다 —
# 시간 초과는 잘린 artifact를 남기고, 그것은 위 내용 검사에서 걸린다.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    # OS 축이 이름에 들어가야 한다 — 없으면 같은 node의 두 leg이 **동일한 check
    # 이름**을 갖고, DD6이 "required status check는 job 이름 문자열로 걸린다"고
    # 못박으며 Task 6 Validate도 그 이름을 판별자로 쓴다.
    name: ${{ matrix.os }} node ${{ matrix.node }} — full-suite wall clock + per-file breakdown
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    # Windows runner 기본 셸은 pwsh이고, PRD L25가 이 저장소에서 `shell: bash`가
    # load-bearing임을 실측했다.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '24']
    steps:
      # ci-full-suite M2 갈래 C — 기본 shallow 체크아웃은 `instruction-contract` lint의
      # C4 strict pass가 요구하는 before-ref를 결정 불가능하게 만든다. 그 lint는
      # `a3-baseline.json`의 `git_head` SHA(또는 origin/main)에서 `git show <ref>:CLAUDE.md`를
      # 읽어 감축 이전 heading 집합을 세우는데, depth 1에는 그 커밋이 없다.
      # 이것은 플랫폼 차이가 아니라 CI 설정이다 — 로컬 저장소는 전체 이력을 가지므로
      # 같은 test가 로컬에서는 항상 green이었다.
      #
      # `persist-credentials: false` — 기본값(true)은 GITHUB_TOKEN을 `.git/config`의
      # `http.https://github.com/.extraheader`에 **평문 base64**로 기록한다. 이 workflow의
      # 트리거는 `workflow_dispatch` 단독이지만(위 `on:`) 전수 스위트는 저장소 전체의
      # tracked `*.test.js`를 돌리므로, 임의 브랜치를 ref 로 지정해 dispatch 하면 그
      # 브랜치가 추가한 test 가 그 파일을 읽어 실패
      # 메시지에 실을 수 있다 — 위협은 트리거가 아니라 **ref 가 임의라는 것**에서 온다.
      # (2026-09-08 M4 정정: 이 주석은 트리거를 `pull_request`라 적었으나 실제로는
      # `workflow_dispatch` 단독이다. 결론은 그대로이고 근거만 정확해졌다.)
      # 메시지에 실을 수 있다. `redact.js`의 `RESIDUAL_PATTERNS`는 경로 패턴 4종뿐이라
      # credential 클래스 커버리지가 0건이고, 그 메시지는 `if: always()`로 조건 없이
      # 올라가는 artifact에 그대로 실린다 (security-reviewer S2, HIGH).
      # 이 job은 이후 어떤 git 쓰기도 하지 않으므로 기능 손실이 없다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # `shell: bash`만으로는 Windows에 `/tmp`가 없다는 사실이 해결되지 않는다.
      # `runner.temp`는 두 OS 모두에서 실재하는 경로를 준다.
      - name: Enumerate (sanity — must equal git ls-files '*.test.js')
        env:
          TMPDIR_ENUM: ${{ runner.temp }}
        run: |
          node scripts/test-suite/run.js --list | sort > "$TMPDIR_ENUM/enum.txt"
          git ls-files '*.test.js' | sort > "$TMPDIR_ENUM/tracked.txt"
          diff "$TMPDIR_ENUM/enum.txt" "$TMPDIR_ENUM/tracked.txt"
          echo "enumerated $(wc -l < "$TMPDIR_ENUM/enum.txt") file(s)"

      # 측정이다. red는 기록되고 수리되지 않는다(UI4·UI5) — 그래서
      # continue-on-error다. 이 플래그가 없으면 스위트의 red가 dispatch를 실패로
      # 만들어 **실패 목록을 담은 artifact가 올라오지 않는다.**
      - name: Full-suite measurement
        continue-on-error: true
        run: node scripts/test-suite/run.js --json > baseline-${{ matrix.os }}-node${{ matrix.node }}.json

      # `if: always()`가 필수다 — 위 단계가 어떻게 끝나든 산출물을 건져야 한다.
      #
      # artifact 이름은 계약이고, M3 Task 6이 그 계약을 **바꾼다**: OS 축이 이름에
      # 없으면 같은 node의 두 job이 동일 이름을 올려 `upload-artifact@v4`가 중복을
      # 거부하고, Windows artifact가 존재 자체를 못 한다. 새 이름은
      # `test-suite-baseline-<os>-node<n>`이다. (개명 이전에 도는 M3 Task 0의
      # dispatch는 옛 이름 `test-suite-baseline-node20`을 그대로 쓴다 — 그 호출은
      # 이 편집보다 앞선다.)
      - name: Upload measurement artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-suite-baseline-${{ matrix.os }}-node${{ matrix.node }}
          path: baseline-${{ matrix.os }}-node${{ matrix.node }}.json
          if-no-files-found: warn

      # 사람이 run 페이지에서 바로 읽을 수 있는 한 줄. 판정이 아니라 요약이다 —
      # 판정은 artifact 내용을 받아 로컬에서 한다(위 Scope note).
      - name: Summarise (non-authoritative)
        if: always()
        continue-on-error: true
        run: |
          f=baseline-${{ matrix.os }}-node${{ matrix.node }}.json
          if [ -s "$f" ]; then
            node -e '
              const j = require("./" + process.argv[1]);
              console.log("ok=" + j.ok +
                " attribution=" + j.attribution +
                " redaction_ok=" + j.redaction_ok +
                " files_total=" + j.files_total +
                " per_file=" + (j.per_file ? j.per_file.length : "null") +
                " wall_clock_ms=" + j.wall_clock_ms +
                " exit_code=" + j.exit_code);
            ' "$f"
          else
            echo "artifact is empty or missing — the runner died before emitting JSON"
          fi
